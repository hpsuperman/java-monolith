server:
  port: 7070
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 20
    max-connections: 8192
    accept-count: 200

spring:
  application:
    name: java-monolith
  profiles:
    active: dev
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    # 不序列化 null 字段，减小响应体
    default-property-inclusion: non_null
  servlet:
    multipart:
      # 与 app.minio.max-file-size 同源，改一处两处都变。上限只有这一个来源：
      # Servlet 容器在解析 multipart 时就拦（超了由 GlobalExceptionHandler 返回 413），
      # 业务侧再按 app.minio.max-file-size 校验一次。
      # 别把它们改成不同的值——容器那道总是先触发，业务校验就永远不执行了。
      max-file-size: ${app.minio.max-file-size}
      # 整个请求体的上限。multipart 编码后比文件本身多几百字节，所以与文件上限取
      # 同一个值时，正好顶到上限的文件会在容器层被拒——代价是多一个 413，不影响正确性。
      max-request-size: ${app.minio.max-file-size}

  # ==================== 数据库版本管理 ====================
  # 表结构由 db/migration 下的脚本定义，应用启动时自动执行。
  # 加一张表 = 新建 V3__xxx.sql → 重启应用，不需要手工跑任何 SQL。
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 存量库（有表但没有 flyway_schema_history）自动打基线，保住已有数据；保持默认 true。
    #
    # ⚠️ 代价：Flyway 官方文档说这会 "removes the safety net"。正常情况下连到一个
    #    非空且无历史表的库会直接报错——那正是防「datasource.url 写错、连到别人的库」
    #    的最后一道防线。打开它之后，连错库会静默打上基线然后开始跑迁移。
    #    所以改 url 里的库名时，务必人工确认一次。
    baseline-on-migrate: true
    # 基线版本。Flyway 默认就是 1，这里显式写出来，别写成 1.0——那是另一个版本号。
    # ⚠️ 后果：某个库第一次被连上时若已经有表、又没有 flyway_schema_history，会被打上
    #    「V1 已执行」的基线，此后 V1__xxx.sql 在那个库上整份跳过——表建不出来，且不报错。
    #    本地要重来就 DROP DATABASE 重建，别手工删单表。
    baseline-version: 1
    # 生产红线：flyway clean 会 DROP 掉整个 schema。
    # 11.x 的默认值已经是 true，这里显式写出来，免得哪天有人靠改配置把它打开。
    clean-disabled: true

# ==================== MyBatis-Plus ====================
mybatis-plus:
  # XML 映射文件位置（与 mapper 接口同名的 XML 放这里）
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.hpsuperman.monolith.modules.**.entity
  global-config:
    banner: false
    db-config:
      # 分布式 ID（雪花算法），也可换 auto 用数据库自增
      id-type: assign_id
      # 逻辑删除：全局配置后，实体上标注 @TableLogic 即可
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      # 更新时忽略 null 字段
      update-strategy: not_null
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true

# ==================== 接口文档 ====================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-produces-media-type: application/json

# ==================== 监控端点 ====================
# 只暴露必要端点，生产环境别开 *
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: true

# ==================== 业务自定义配置 ====================
app:
  jwt:
    # 生产环境务必用环境变量覆盖，且长度 >= 32 字节（HS256 要求 256 位密钥）
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-in-production-0123456789abcdef}
    access-token-ttl: 30m
    refresh-token-ttl: 7d
    issuer: java-monolith
  cors:
    allowed-origins: "*"
    allowed-methods: "*"
    allow-credentials: false
  minio:
    # 本地 MinIO 由 docker-compose 的 minio 服务提供，桶也由它建好并设为公开读
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:monolith}
    # ⚠️ 拼进返回给前端的 url 的地址，与应用连 MinIO 用的 endpoint 是两回事。
    #    应用和 MinIO 都在本机时留空即可（回退用 endpoint）。
    #    应用跑在容器里时 endpoint 得写 http://minio:9000，但那个主机名浏览器解析不了，
    #    此时必须把这里填成浏览器能访问的地址（如 http://localhost:9000）。
    public-url: ${MINIO_PUBLIC_URL:}
    max-file-size: 20MB
    allowed-extensions: jpg,jpeg,png,gif,webp,bmp

logging:
  level:
    root: info
    com.hpsuperman.monolith: info
