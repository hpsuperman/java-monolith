# 本地开发用基础设施：MySQL + Redis + RocketMQ + MinIO
# 启动：docker compose up -d
# 查看状态：docker compose ps
# 停止并清空数据：docker compose down -v
#
# 只想起一部分（比如本地已有 MySQL）：
#   docker compose up -d redis rocketmq-namesrv rocketmq-broker minio minio-init
#
# MinIO 控制台 http://localhost:9001 （minioadmin / minioadmin）
# 桶名默认 monolith，由 minio-init 建好并设为公开读（前端 <img src> 直接能用）

services:

  mysql:
    image: mysql:8.0
    container_name: monolith-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: monolith
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - monolith-mysql-data:/var/lib/mysql
      # 这里以前挂的是 db/schema.sql，现在建表已经交给应用侧的 Flyway 了
      # （见 src/main/resources/db/migration），不再需要 initdb.d 挂载。
      # MYSQL_DATABASE 保留着：Flyway 只能往已存在的库里迁移，建库这一步还得靠它。
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - monolith

  redis:
    image: redis:7-alpine
    container_name: monolith-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - monolith-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monolith

  # 一次性任务：把数据卷的属主改成 rocketmq（uid 3000）。
  # 镜像里没有 /home/rocketmq/store 这个目录，Docker 建挂载点时会建成 root:root，
  # 而 broker 是以 uid 3000 启动的，写不进去就直接退出（exit 255），日志也留不下来。
  rocketmq-init:
    image: alpine:3.20
    container_name: monolith-rocketmq-init
    command: >
      sh -c "chown -R 3000:3000 /home/rocketmq/store /home/rocketmq/logs"
    volumes:
      - monolith-rocketmq-broker-store:/home/rocketmq/store
      - monolith-rocketmq-broker-logs:/home/rocketmq/logs
    networks:
      - monolith

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: monolith-rocketmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
    ports:
      - "9876:9876"
    volumes:
      - monolith-rocketmq-namesrv-logs:/home/rocketmq/logs
    networks:
      - monolith

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: monolith-rocketmq-broker
    restart: unless-stopped
    depends_on:
      rocketmq-namesrv:
        condition: service_started
      rocketmq-init:
        condition: service_completed_successfully
    # -c 指定配置文件，里面的 brokerIP1 是关键，见 docker/rocketmq/broker.conf
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    environment:
      NAMESRV_ADDR: "rocketmq-namesrv:9876"
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
      - monolith-rocketmq-broker-logs:/home/rocketmq/logs
      - monolith-rocketmq-broker-store:/home/rocketmq/store
    networks:
      - monolith

  minio:
    # ⚠️ MinIO 2025-10 起停发 Docker Hub 镜像，minio/minio 已拉不到，只能用 quay.io。
    #    这里钉的是 quay 上最新的一个 tag（2025-09-07 底座 + 2026-04 hotfix）。
    #    它带不带 CVE-2025-62506 的修复没验证过，官方修复版 RELEASE.2025-10-15 根本没发镜像。
    #    本地开发无所谓，拿这个文件当模板发出去之前自己掂量。
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
    container_name: monolith-minio
    restart: unless-stopped
    # 9000 是 S3 API（应用和浏览器都走它），9001 是 Web 控制台
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - monolith-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - monolith

  # 一次性任务：建桶 + 设为公开读，跑完就退出。
  # 不在应用启动时建桶——那会让应用像依赖 MySQL 一样依赖 MinIO 可用。
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: monolith-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/monolith &&
      mc anonymous set download local/monolith &&
      echo 'bucket monolith 就绪（公开读）'
      "
    networks:
      - monolith

volumes:
  monolith-mysql-data:
  monolith-minio-data:
  monolith-redis-data:
  monolith-rocketmq-namesrv-logs:
  monolith-rocketmq-broker-logs:
  monolith-rocketmq-broker-store:

networks:
  monolith:
    driver: bridge
