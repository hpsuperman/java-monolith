brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# ============================================================
# 关键配置：brokerIP1
#
# broker 启动后会把自己的地址注册到 NameServer，客户端从 NameServer
# 拿到这个地址再去连 broker。容器里默认取的是容器内网 IP（如 172.x.x.x），
# 宿主机上的应用连不上，表现为发送消息超时。
#
# 本地开发固定写成 127.0.0.1，让宿主机能直连映射出来的 10911 端口。
# 如果应用也跑在 docker 网络里，这里要改成 broker 的服务名或
# 宿主机在 docker 网络中的可达地址。
# ============================================================
brokerIP1 = 127.0.0.1

# 开发环境允许自动创建 topic，省去手工执行 mqadmin updateTopic。
# 生产环境必须关掉，改为显式创建并规划队列数。
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 单机最小副本，避免非 root 用户启动时报权限问题
defaultTopicQueueNums = 4
